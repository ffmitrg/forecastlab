[project]
name = "forecastlab"
version = "0.1.0"
description = "Evidence-first, multi-agent forecasting course project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "pydantic==2.11.4",
  "python-dotenv==1.1.0",
  "openai==1.78.1",
  "langgraph==0.4.5",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==8.3.5"]
browser = ["playwright==1.57.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
